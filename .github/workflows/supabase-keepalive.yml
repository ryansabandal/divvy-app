name: Supabase keepalive

# Supabase's free tier pauses a project after ~7 days of low activity. Divvy has no login —
# every session is reached via a shared link that must keep working indefinitely — so an
# unexpected pause is a hard outage. This hits /api/health, which runs a real `SELECT 1`
# through Prisma (not just a static 200), so it registers as genuine database activity.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository activity. If pings
# stop showing up in the Actions tab, re-trigger this manually (workflow_dispatch, below) to
# reset the clock, and check the schedule is still enabled under Actions settings.
on:
  schedule:
    # Every 3 days, well under Supabase's ~7 day pause window, with real margin for GitHub's own
    # scheduled-run delays. Off the top-of-hour/top-of-day mark (03:17 UTC) since GitHub warns
    # those slots see the worst scheduling congestion, where a delay could push a ping past the
    # pause deadline it exists to prevent.
    - cron: "17 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health to keep the Supabase project active
        # --fail-with-body (not --fail): the 2026-08-21 outage returned an empty body by design
        # (see app/api/health/route.ts), but a future failure mode may not, so surface whatever
        # comes back instead of discarding it. --max-time caps a hung connection. --retry absorbs
        # a single transient network blip so one flaky run doesn't produce a red run that trains
        # us to ignore red runs — which is the actual failure mode the 2026-08-21 postmortem found.
        run: >
          curl --fail-with-body --max-time 30 --retry 2 --retry-delay 10
          https://divvy-app-zeta.vercel.app/api/health
